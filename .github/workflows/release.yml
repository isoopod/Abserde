name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Upload the CLI binaries
  build-cli:
    name: Build CLI (${{ matrix.os-name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-name: linux
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os-name: linux
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            os-name: macos
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os-name: macos
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os-name: windows
            arch: x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            os-name: windows
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        shell: bash

      - name: Update Cargo.toml version
        run: |
          sed -i.bak "s/^version = .*/version = \"${{ env.VERSION }}\"/" abserde-cli/Cargo.toml
        shell: bash

      # Install cross-compilation tools for Linux Aarch64 if needed
      - name: Install ARM target tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "abserde-cli"

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} -p abserde
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target}}/release
          zip -j ../../../abserde-${{ env.VERSION }}-${{ matrix.os-name }}-${{ matrix.arch }}.zip abserde

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../abserde-${{ env.VERSION }}-${{ matrix.os-name }}-${{ matrix.arch }}.zip abserde.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os-name }}-${{ matrix.arch }}
          path: abserde-*.zip
  # TODO: Build and upload the library
  # Publish
  publish:
    name: Publish
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*
          generate_release_notes: true
